apiVersion: v1
kind: Pod
metadata:
  name: daggerheart-asteroids
  annotations:
    servicebay.label: "DaggerHeart: Asteroids"
    servicebay.ports: "8080/tcp"
    servicebay.schema-version: "1"
    servicebay.dependencies: ""
    servicebay.healthcheck: "http://host.containers.internal:8080/"
spec:
  restartPolicy: Always
  containers:
    - name: game
      image: ghcr.io/mdopp/daggerheart-asteroids:latest
      ports:
        - containerPort: 8080
          hostPort: 8080
          protocol: TCP
      resources:
        limits:
          memory: "128Mi"
          cpu: "250m"
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 10
