apiVersion: v1
kind: Pod
metadata:
  name: daggerheart-asteroids
  annotations:
    servicebay.label: "DaggerHeart: Asteroids"
    servicebay.ports: "8080/tcp"
    servicebay.schema-version: "1"
    servicebay.dependencies: ""
    servicebay.healthcheck: "http://host.containers.internal:8080/"
spec:
  restartPolicy: Always
  containers:
    - name: game
      image: docker.io/library/node:20-alpine
      ports:
        - containerPort: 8080
          hostPort: 8080
          protocol: TCP
      command: ["sh", "-c"]
      args:
        - |
          mkdir -p /app/dist
          echo "" | gzip -d > /app/dist/index.html
          node -e "var http=require('http'),fs=require('fs'),path=require('path');var PORT=8080,DIR='/app/dist';var MIME={html:'text/html',js:'application/javascript',css:'text/css',png:'image/png',jpg:'image/jpeg',svg:'image/svg+xml'};http.createServer(function(req,res){var u=req.url.split('?')[0];if(u==='/'){u='/index.html';}var f=DIR+u;var ext=path.extname(u).slice(1);fs.readFile(f,function(err,data){if(err){res.writeHead(404);res.end('Not Found');return;}res.writeHead(200,{'Content-Type':MIME[ext]||'text/plain'});res.end(data);});}).listen(PORT,function(){console.log('DaggerHeart Asteroids on :'+PORT);});"
      resources:
        limits:
          memory: "128Mi"
          cpu: "250m"
      env:
        - name: PORT
          value: "8080"
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 10
